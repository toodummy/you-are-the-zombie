<title>You Are the Zombie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one 16:9 game stage, centred, with touch controls below it on phones. Single dark look taken from the concept art. */
:root{
  color-scheme:dark;
  --night:#1B1230; --ink:#17121F; --bone:#F4EFD8; --acid:#C6F135; --coral:#FF5A3C; --teal:#5CC8C2; --lilac:#B9A3F0;
  --display:'Bowlby One',Impact,sans-serif; --body:'Space Grotesk','Trebuchet MS',Arial,sans-serif;
  --controls:0px;
}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);font-family:var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow:hidden;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage{position:relative;width:min(100%,calc((100dvh - 16px - var(--controls))*16/9));aspect-ratio:16/9;max-width:100%;container-type:inline-size;background:var(--night)}
canvas{display:block;width:100%;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1.4cqw;padding:3cqw 5cqw;box-sizing:border-box;overflow:auto}
.screen.dim{background:rgba(23,18,31,.72)}
.screen h1{margin:0;font:400 max(30px,8.4cqw)/1 var(--display);text-wrap:balance}
.screen h1 span{color:var(--acid);display:block}
.screen p{margin:0;font-size:max(13px,2cqw);line-height:1.35;max-width:52ch;font-weight:700}
.keys{display:grid;grid-template-columns:auto auto;gap:.4cqw 2cqw;font-size:max(12px,1.5cqw);font-weight:500;max-width:60cqw;background:var(--ink);padding:1cqw 1.4cqw}
.keys b{color:var(--acid);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:1.2cqw;margin-top:.8cqw}
.btn{font:400 max(15px,2.3cqw)/1 var(--display);padding:max(11px,1.3cqw) max(18px,2.6cqw);background:var(--acid);color:var(--ink);border:4px solid var(--ink);box-shadow:0 0 0 2px var(--acid);cursor:pointer}
.btn.alt{background:var(--bone);box-shadow:0 0 0 2px var(--bone)}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible,.pad button:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.pad{display:none;width:100%;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.pad div{display:flex;gap:8px;flex:1 1 240px;max-width:300px;min-width:0}
.pad button{font:400 13px/1 var(--display);flex:1 1 0;min-width:0;height:60px;border:3px solid var(--ink);color:var(--ink);background:var(--bone);touch-action:none;padding:0}
.pad .bite{background:var(--coral)}.pad .rush{background:var(--acid)}.pad .scream{background:var(--lilac);font-size:11px}
@media (pointer:coarse){
  :root{--controls:150px}
  .pad{display:flex}
  .keys{display:none}
}
@media (pointer:coarse) and (orientation:landscape){
  :root{--controls:0px}
  .pad{position:fixed;left:0;right:0;bottom:6px;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
  .pad button{pointer-events:auto;opacity:.82}
}
</style>

<div class="stage">
  <canvas id="c" width="1280" height="720" role="img" aria-label="You Are the Zombie game screen"></canvas>
  <div class="screen" id="screen">
    <h1 id="sTitle">You are<span>the zombie</span></h1>
    <p id="sText">One bite. Then a horde. Reach the lab and smash the cure before it is finished.</p>
    <div class="keys" id="keys">
      <b>A D or arrows</b><span>Walk</span>
      <b>W, Up or Space</b><span>Jump</span>
      <b>J</b><span>Bite</span>
      <b>K</b><span>Rush: the horde speeds up</span>
      <b>L</b><span>Scream: stuns nearby humans</span>
      <b>P / M</b><span>Pause / sound</span>
    </div>
    <div class="row">
      <button class="btn" id="primary" type="button">Start biting</button>
      <button class="btn alt" id="secondary" type="button" hidden>Start over</button>
    </div>
  </div>
</div>
<div class="pad" id="pad" aria-label="Touch controls">
  <div>
    <button type="button" data-k="left" aria-label="Walk left">LEFT</button>
    <button type="button" data-k="right" aria-label="Walk right">RIGHT</button>
    <button type="button" data-k="jump">JUMP</button>
  </div>
  <div>
    <button type="button" class="bite" data-k="bite">BITE</button>
    <button type="button" class="rush" data-k="rush">RUSH</button>
    <button type="button" class="scream" data-k="scream">SCREAM</button>
  </div>
</div>

/* ---------- Drawing helpers: the sprites reuse the concept art's paths ---------- */
const cache = new Map();
const path = d => { let p = cache.get(d); if (!p) { p = new Path2D(d); cache.set(d, p); } return p; };
function F(d, fill) { g.fillStyle = fill; g.fill(path(d)); g.lineWidth = 6; g.strokeStyle = INK; g.stroke(path(d)); }

function E(x, y, rx, ry, fill) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.fillStyle = fill; g.fill(); g.lineWidth = 6; g.strokeStyle = INK; g.stroke(); }
function L(pts, color, w) {
  w = w || 13;

  for (const [c, lw] of [[INK, w + 11], [color, w]]) {
    g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    g.strokeStyle = c; g.lineWidth = lw; g.stroke();

}
function moved(x, y, fn) { g.save(); g.translate(x, y); fn(); g.restore(); }

/* Each sprite is drawn in concept-art units: about 300 wide, feet at y 420. */

/* ---------- Game data ---------- */
const TYPES = {

/* ---------- State ---------- */
let G = null, mode = 'title', last = 0, time = 0, shake = 0, muted = store.get('zombie-muted') === '1';
const keys = {};
